          - paragraph [ref=e66]: A good unboxing experience is easy to understand. Fewer loose pieces, clear opening points, and concise instructions can make the first interaction feel welcoming.
          - heading "Make the next step clear" [level=2] [ref=e67]
          - paragraph [ref=e68]: After opening, people should know what can be reused and how to sort the remaining material. Clear language and recognizable material choices help close that loop.
