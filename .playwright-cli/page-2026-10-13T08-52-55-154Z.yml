          - heading "Begin with a useful question" [level=2] [ref=e62]
          - paragraph [ref=e63]: What small part of the day could feel easier? A strong starting point is often an ordinary moment rather than a dramatic invention.
          - paragraph [ref=e64]: "In this fictional design journey, the team begins with quick sketches and a few simple prototypes. The first goal is to understand the gesture: where a hand rests, how an object moves, and what the user expects to happen next."
          - heading "Learn from the prototype" [level=2] [ref=e65]
          - paragraph [ref=e66]: A prototype makes an idea tangible. Try it in the setting where it will be used, then write down the details that feel natural and the ones that need attention.
          - heading "Questions worth asking" [level=3] [ref=e67]
          - list [ref=e68]:
            - listitem [ref=e69]: Can someone understand the product without an explanation?
            - listitem [ref=e70]: Does the shape support the intended movement?
            - listitem [ref=e71]: Can the design become simpler while staying useful?
          - heading "Build a familiar experience" [level=2] [ref=e72]
          - paragraph [ref=e73]: As the details come together, the product becomes less noticeable and more dependable. It starts to feel like a natural part of a familiar routine.
          - paragraph [ref=e74]: This sample story is a reminder that thoughtful iteration can make everyday objects feel clear, comfortable, and easy to return to.
