name: CI Ecolitea

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, type-check, and build
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: mongodb://127.0.0.1:27017/ecolitea-ci
      PAYLOAD_SECRET: ci-only-payload-secret-that-is-at-least-32-characters
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      PREVIEW_SECRET: ci-only-preview-secret
      R2_BUCKET: ci-only-bucket
      R2_ACCESS_KEY_ID: ci-only-access-key
      R2_SECRET_ACCESS_KEY: ci-only-secret-key
      R2_ENDPOINT: https://ci-only-account.r2.cloudflarestorage.com
      R2_PUBLIC_URL: https://media.example.invalid
      DISABLE_R2_STORAGE: "true"
      NEXT_PUBLIC_ENABLE_CLOUD: "false"
      NEXT_PUBLIC_ENABLE_COMMUNITY_HELP: "false"
      NEXT_PUBLIC_ENABLE_PARTNERS: "false"
      NEXT_PUBLIC_ENABLE_STYLEGUIDE: "false"

    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run integration tests
        run: corepack pnpm test:int

      - name: Run end-to-end tests (emulated storage and native files)
        run: corepack pnpm test:e2e:all

      - name: Type-check
        run: corepack pnpm exec tsc --noEmit --incremental false

      - name: Build
        run: corepack pnpm build
