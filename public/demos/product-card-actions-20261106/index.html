<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>产品卡片 · View More 按钮预览</title>
    <link rel="stylesheet" href="/demos/products-b2b-concepts-20261104/tokens.css" />
    <style>
      @font-face {
        font-family: Geist;
        src: url('/demos/products-b2b-concepts-20261104/Geist-Regular.woff2') format('woff2');
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.4 Geist,
          sans-serif;
        color: var(--website-color-foreground);
        background: var(--website-color-background);
      }
      iframe {
        display: block;
        width: 100%;
        height: 100dvh;
        border: 0;
      }
      .tools {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 32px);
        padding: 8px;
        border: 1px solid var(--website-color-border);
        border-radius: var(--website-radius-content);
        background: var(--website-color-surface);
        box-shadow: var(--website-shadow-subtle);
      }
      .tools p {
        margin: 0 8px;
      }
      .tools p span {
        display: block;
        margin-top: 2px;
        color: var(--website-color-muted-foreground);
        font-size: 11px;
      }
      .group {
        display: flex;
        gap: 4px;
      }
      .group + .group {
        padding-left: 8px;
        border-left: 1px solid var(--website-color-border);
      }
      button {
        min-height: 44px;
        padding: 8px 12px;
        font: inherit;
        color: var(--website-color-foreground);
        background: var(--website-color-surface);
        border: 1px solid var(--website-color-border);
        border-radius: var(--website-radius-control);
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        color: var(--website-color-action-foreground);
        background: var(--website-color-action);
        border-color: var(--website-color-action);
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button:focus-visible {
        outline: 2px solid var(--website-color-focus);
        outline-offset: 3px;
      }
      .tools.compact {
        padding: 4px;
      }
      .tools.compact > :not(#collapse) {
        display: none;
      }
      @media (width < 48rem) {
        .tools {
          left: 8px;
          right: 8px;
          bottom: 8px;
          max-width: none;
        }
        .tools p {
          flex-basis: 100%;
          margin: 0;
          font-size: 11px;
        }
        button {
          font-size: 12px;
          padding-inline: 8px;
        }
        .tools.compact {
          left: auto;
        }
      }
    </style>
    <script src="preview.js?revision=system-black" defer></script>
  </head>
  <body>
    <iframe id="page" title="产品总览与分类页的 View More 按钮 UI 稿"></iframe>
    <aside class="tools" aria-label="产品卡片 UI 稿工具">
      <p>产品卡片按钮<span id="status" role="status">正在读取当前页面…</span></p>
      <div class="group" aria-label="预览页面">
        <button id="overview" type="button" aria-pressed="true" disabled>产品总览</button>
        <button id="category" type="button" aria-pressed="false" disabled>产品分类页</button>
      </div>
      <div class="group" aria-label="前后对比">
        <button id="design" type="button" aria-pressed="true" disabled>按钮方案</button>
        <button id="original" type="button" aria-pressed="false" disabled>当前正式版</button>
      </div>
      <button id="collapse" type="button" aria-expanded="true" aria-label="收起预览工具">
        收起
      </button>
    </aside>
  </body>
</html>
