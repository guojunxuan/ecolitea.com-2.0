# Local development services only. Never deploy this file.
# Mailpit captures all outbound email locally; nothing is delivered to real inboxes.
#   corepack pnpm mail:up    -> SMTP 127.0.0.1:1025, Web UI http://localhost:8025
#   corepack pnpm mail:down
name: ecolitea-dev

services:
  mailpit:
    image: ${MAILPIT_IMAGE:-ghcr.io/axllent/mailpit:v1.34.0}
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
