<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mobile TOC · mockup</title>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('../template-a/Geist-Variable.woff2') format('woff2');
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    --white: #ffffff;
    --n100: #f7f7f8;
    --n300: #e0e0e2;
    --n500: #9a9aa1;
    --n600: #76767f;
    --n900: #262629;
    --fg: var(--n900);
    --muted: var(--n600);
    --border: var(--n300);
    --gutter: 1.5rem;
    --header-height: 60px;
    --bar-height: 50px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Geist', system-ui, sans-serif;
    color: var(--fg);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }

  /* Mockup controls */
  .mock {
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 40;
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 6px 6px 14px;
    background: var(--n100);
    color: var(--muted);
    font-size: 12px;
  }
  .mock button {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--white);
    color: var(--fg);
    font: inherit;
    cursor: pointer;
  }

  /* Fixed site header replica */
  .site-header {
    position: fixed;
    inset: 0 0 auto;
    z-index: 30;
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    align-items: center;
    height: var(--header-height);
    padding-inline: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
  }
  .site-header svg { width: 22px; height: 22px; }
  .logo { justify-self: center; text-align: center; line-height: 1; }
  .logo strong { display: block; font-size: 20px; letter-spacing: 0.04em; }
  .logo span { display: block; margin-top: 2px; font-size: 7px; letter-spacing: 0.18em; font-weight: 600; }
  .spacer { height: var(--header-height); }

  .container { padding-inline: var(--gutter); }
  .breadcrumb { margin: 40px 0 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h1 { margin: 32px 0 0; font-size: 36px; font-weight: 600; line-height: 1.05; letter-spacing: -0.032em; }
  .byline { margin-top: 24px; color: var(--muted); font-size: 14px; }
  .byline strong { color: var(--fg); }
  .hero { margin-top: 32px; height: 220px; border-radius: 12px; background: url('../template-a/img/interest-16.jpg') center / cover; }

  /* Sticky TOC bar */
  .toc {
    position: sticky;
    top: var(--header-height);
    z-index: 20;
    margin: 32px calc(-1 * var(--gutter)) 0;
  }
  .bar {
    position: relative;
    z-index: 2;
    padding-inline: var(--gutter);
    border-block: 1px solid var(--border);
    background: color-mix(in srgb, var(--white) 92%, transparent);
    backdrop-filter: blur(8px);
  }
  .trigger {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 48px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--fg);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .eyebrow {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .current {
    overflow: hidden;
    font-size: 14px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trigger svg {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-left: auto;
    transition: transform 160ms var(--ease);
  }
  .trigger[aria-expanded='true'] svg { transform: rotate(180deg); }
  .trigger:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  /* Dropdown panel */
  .panel {
    position: absolute;
    top: 100%;
    inset-inline: 0;
    z-index: 2;
    max-height: min(60dvh, 28rem);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px var(--gutter) 20px;
    border-bottom: 1px solid var(--border);
    background: var(--white);
    box-shadow: 0 12px 24px rgb(0 0 0 / 8%);
  }
  .panel[hidden] { display: none; }

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgb(0 0 0 / 16%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms var(--ease);
  }
  .toc.open .scrim { opacity: 1; pointer-events: auto; }
  body.no-scrim .scrim { background: transparent; }

  .list {
    position: relative;
    margin: 0;
    padding: 0;
    border-left: 1px solid var(--border);
    list-style: none;
  }
  .indicator {
    position: absolute;
    top: 0;
    left: -2px;
    width: 3px;
    height: 0;
    border-radius: 2px;
    background: var(--fg);
    transition:
      transform 240ms var(--ease),
      height 240ms var(--ease),
      opacity 160ms var(--ease);
  }
  .indicator.instant { transition: none; }

  .list li.h2:not(:first-child) { margin-top: 8px; }
  .list a {
    display: flex;
    align-items: center;
    padding-right: 4px;
    border-radius: 0 6px 6px 0;
    overflow-wrap: anywhere;
    transition: background-color 120ms var(--ease), color 120ms var(--ease);
  }
  .h2 > a {
    min-height: 44px;
    padding-block: 10px;
    padding-left: 16px;
    color: color-mix(in srgb, var(--fg) 80%, transparent);
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
  }
  .h3 > a {
    min-height: 36px;
    padding-block: 6px;
    padding-left: 32px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.35;
  }
  .list a[aria-current='location'] { color: var(--fg); }
  .h3 > a[aria-current='location'] { font-weight: 500; }
  .list a.pressed { background: var(--n100); color: var(--fg); }
  .list a:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }

  @media (prefers-reduced-motion: reduce) {
    .indicator, .trigger svg, .scrim, .list a { transition: none; }
  }

  /* Article */
  article { padding-top: 24px; }
  article h2, article h3 {
    scroll-margin-top: calc(var(--header-height) + var(--bar-height) + 16px);
    letter-spacing: -0.015em;
  }
  article h2 { margin: 40px 0 12px; font-size: 24px; line-height: 1.25; }
  article h3 { margin: 28px 0 10px; font-size: 19px; line-height: 1.3; }
  article p { margin: 0 0 1.1em; font-size: 17px; line-height: 1.7; }
  .end { height: 40vh; }
</style>
</head>
<body>
  <div class="mock">
    <span>Mockup</span>
    <button type="button" id="toggle-scrim" aria-pressed="true">遮罩：开</button>
  </div>

  <header class="site-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <div class="logo"><strong>ECOLITEA</strong><span>ILLUMINATE THE FUTURE</span></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </header>
  <div class="spacer"></div>

  <main class="container">
    <p class="breadcrumb">Home / Blogs / Product Insights / Small details, better everyday products</p>
    <h1>Small details, better everyday products</h1>
    <p class="byline">By <strong>admin</strong> · October 3, 2026</p>
    <div class="hero" role="img" aria-label="Coastal Rides"></div>

    <div class="toc" id="toc">
      <div class="bar">
        <button class="trigger" type="button" id="trigger" aria-label="Table of contents" aria-controls="panel" aria-expanded="false">
          <span class="eyebrow">On this page</span>
          <span class="current" id="current"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <nav class="panel" id="panel" aria-label="Table of contents" hidden>
        <ol class="list" id="list"><span class="indicator" id="indicator" aria-hidden="true"></span></ol>
      </nav>
      <div class="scrim" id="scrim"></div>
    </div>

    <article id="article"></article>
    <div class="end"></div>
  </main>

  <script type="module">
    const sections = await (await fetch('./content.json')).json()

    const article = document.getElementById('article')
    article.innerHTML = sections
      .map((s) => `<h${s.level} id="${s.id}">${s.text}</h${s.level}>${s.body.map((p) => `<p>${p}</p>`).join('')}`)
      .join('')

    const list = document.getElementById('list')
    list.insertAdjacentHTML(
      'beforeend',
      sections.map((s) => `<li class="h${s.level}"><a href="#${s.id}">${s.text}</a></li>`).join(''),
    )

    const toc = document.getElementById('toc')
    const trigger = document.getElementById('trigger')
    const panel = document.getElementById('panel')
    const indicator = document.getElementById('indicator')
    const current = document.getElementById('current')
    const scrim = document.getElementById('scrim')
    const links = [...list.querySelectorAll('a')]
    const headings = sections.map((s) => document.getElementById(s.id))
    const reduced = matchMedia('(prefers-reduced-motion: reduce)')
    let activeId = sections[0].id

    const moveIndicator = (link, { instant = false } = {}) => {
      indicator.classList.toggle('instant', instant || reduced.matches)
      indicator.style.transform = `translateY(${link.parentElement.offsetTop}px)`
      indicator.style.height = `${link.offsetHeight}px`
      if (instant) void indicator.offsetHeight
      indicator.classList.remove('instant')
    }
    const activeLink = () => links.find((link) => link.hash === `#${activeId}`)

    const setActive = (id) => {
      activeId = id
      for (const link of links) link.toggleAttribute('aria-current', link.hash === `#${id}`)
      for (const link of links) if (link.hash === `#${id}`) link.setAttribute('aria-current', 'location')
      current.textContent = sections.find((s) => s.id === id).text
      if (!panel.hidden) moveIndicator(activeLink())
    }

    const updateActive = () => {
      const line = innerHeight * 0.3
      const passed = headings.filter((h) => h.getBoundingClientRect().top <= line)
      setActive((passed.at(-1) ?? headings[0]).id)
    }
    addEventListener('scroll', () => requestAnimationFrame(updateActive), { passive: true })
    updateActive()

    const open = () => {
      panel.hidden = false
      toc.classList.add('open')
      trigger.setAttribute('aria-expanded', 'true')
      const link = activeLink()
      // Bring the current section to the upper third, then slide the indicator in from the top.
      panel.scrollTop = Math.max(0, link.parentElement.offsetTop - panel.clientHeight * 0.25)
      indicator.classList.add('instant')
      indicator.style.transform = `translateY(${panel.scrollTop}px)`
      indicator.style.height = `${link.offsetHeight}px`
      void indicator.offsetHeight
      moveIndicator(link)
    }
    const close = ({ focus = false } = {}) => {
      panel.hidden = true
      toc.classList.remove('open')
      trigger.setAttribute('aria-expanded', 'false')
      if (focus) trigger.focus()
    }

    trigger.addEventListener('click', () => (panel.hidden ? open() : close()))
    scrim.addEventListener('click', () => close())
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && !panel.hidden) close({ focus: true })
    })

    // Touch press mirrors desktop hover: the indicator follows the pressed row.
    let pressed = null
    const release = () => {
      pressed?.classList.remove('pressed')
      pressed = null
      if (!panel.hidden) moveIndicator(activeLink())
    }
    list.addEventListener('pointerdown', (event) => {
      const link = event.target.closest('a')
      if (!link) return
      pressed = link
      link.classList.add('pressed')
      moveIndicator(link)
    })
    list.addEventListener('pointercancel', release)
    list.addEventListener('pointerleave', release)
    panel.addEventListener('scroll', () => pressed && release(), { passive: true })
    list.addEventListener('click', (event) => {
      const link = event.target.closest('a')
      if (!link) return
      pressed?.classList.remove('pressed')
      pressed = null
      close()
    })

    const toggle = document.getElementById('toggle-scrim')
    toggle.addEventListener('click', () => {
      const on = document.body.classList.toggle('no-scrim') === false
      toggle.setAttribute('aria-pressed', String(on))
      toggle.textContent = `遮罩：${on ? '开' : '关'}`
    })
  </script>
</body>
</html>
